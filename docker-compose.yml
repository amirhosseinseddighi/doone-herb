services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
          initial_sync: true
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
            - "*.pyo"

        # 2. Rebuild the image when dependencies change
        - action: rebuild
          path: ./pyproject.toml

        - action: rebuild
          path: ./uv.lock

        # Optional: also watch alembic if you want
        - action: sync+restart
          path: ./alembic
          target: /app/alembic

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # if you need to connect from the host (psql, DBeaver, etc.)
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # for local development, you can connect from host
    ports:
      - "6379:6379"


  frontend:
    image: python:3.13-slim-bookworm
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    ports:
      - "7000:7000"
    depends_on:
      - app
    command: ["python3", "-m","http.server","7000"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
