<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازنشانی رمز عبور · دونه هرب</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #fbfaf7; color: #12211a; font-family: "Vazirmatn", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
  h1 { font-family: "Vazirmatn", system-ui, sans-serif; font-weight: 800; font-size: 26px; margin: 0 0 8px; }
  p.sub { margin: 0 0 22px; font-size: 14px; color: #7d857f; line-height: 1.55; }
  .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #eceae3; border-radius: 26px; padding: 30px 28px; box-shadow: 0 18px 50px -30px rgba(18,33,26,0.25); }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 26px; }
  .brand .mark { width: 30px; height: 30px; border-radius: 10px; background: #0f7a4a; display: flex; align-items: center; justify-content: center; color: #d8f24b; font-size: 15px; }
  .brand .name { font-family: "Vazirmatn", sans-serif; font-weight: 800; font-size: 19px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #4c554f; margin: 0 4px 6px 0; }
  input { width: 100%; height: 46px; padding: 0 16px; border: 0; border-radius: 999px; background: #f1efe8; outline: none; font-size: 14px; margin-bottom: 10px; }
  input:focus { box-shadow: 0 0 0 2px #0f7a4a33; }
  button { width: 100%; height: 48px; border: 0; border-radius: 999px; background: #12211a; color: #d8f24b; font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  button:disabled { opacity: 0.6; cursor: default; }
  .err { display: none; font-size: 12.5px; color: #b8451f; background: #fdf1ea; border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; line-height: 1.5; }
  .ok { display: none; text-align: center; padding: 8px 0 2px; }
  .ok .tick { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 999px; background: #eaf6ee; color: #0b5c38; font-size: 24px; display: flex; align-items: center; justify-content: center; }
  .ok h2 { font-family: "Vazirmatn", sans-serif; font-weight: 800; font-size: 20px; margin: 0 0 6px; }
  .ok p { margin: 0; font-size: 13.5px; color: #7d857f; }
  .back { display: inline-block; margin-top: 18px; font-size: 12.5px; font-weight: 600; color: #0f7a4a; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="mark">دح</span>
      <span class="name">دونه هرب</span>
    </div>

    <form id="resetForm" novalidate>
      <h1>بازنشانی رمز عبور</h1>
      <p class="sub">برای حساب خود یک رمز عبور تازه انتخاب کنید. لینک یک ساعت پس از ارسال منقضی می‌شود.</p>
      <div class="err" id="err"></div>
      <input type="hidden" id="token" name="token" value="" />
      <label for="pw">رمز عبور جدید</label>
      <input id="pw" type="password" placeholder="رمز عبور جدید" autocomplete="new-password" />
      <label for="pw2">تکرار رمز عبور جدید</label>
      <input id="pw2" type="password" placeholder="تکرار رمز عبور جدید" autocomplete="new-password" />
      <button id="go" type="submit">بازنشانی رمز عبور</button>
    </form>

    <div class="ok" id="ok">
      <div class="tick">✓</div>
      <h2>رمز عبور به‌روزرسانی شد</h2>
      <p>رمز عبور شما تغییر کرد.<br>در حال انتقال به صفحه ورود…</p>
      <a class="back" href="/index.html">همین حالا وارد شوید</a>
    </div>
  </div>

<script>
  const API_BASE = "http://127.0.0.1:8000";
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get("token") || "";
  if (urlToken) {
    document.getElementById("token").value = urlToken;
  }
  // Clean the URL so a refreshed page doesn't re-submit with a burned token.
  if (urlToken) window.history.replaceState({}, "", window.location.pathname);

  const errBox = document.getElementById("err");
  function showError(msg) { errBox.textContent = msg; errBox.style.display = "block"; }
  function hideError() { errBox.style.display = "none"; }

  async function parseError(res) {
    try {
      const data = await res.json();
      const d = data.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d) && d[0] && d[0].msg) return d[0].msg.replace(/^Value error,?\s*/i, "");
      if (data.message) return data.message;
    } catch (e) { /* fall through */ }
    return "بازنشانی رمز عبور ممکن نشد. دوباره تلاش کنید.";
  }

  document.getElementById("resetForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    hideError();
    const token = document.getElementById("token").value.trim();
    const pw = document.getElementById("pw").value;
    const pw2 = document.getElementById("pw2").value;

    if (!token) { showError("لینک فاقد توکن است. از صفحه ورود، لینک بازیابی تازه‌ای بگیرید."); return; }
    if (pw.length < 8) { showError("رمز عبور باید حداقل ۸ کاراکتر باشد."); return; }
    if (!/[a-z]/.test(pw) || !/[A-Z]/.test(pw) || !/[0-9]/.test(pw) || !/[^A-Za-z0-9]/.test(pw)) {
      showError("رمز عبور باید حرف بزرگ و کوچک، عدد و نماد داشته باشد.");
      return;
    }
    if (pw !== pw2) { showError("رمزهای عبور یکسان نیستند."); return; }

    const btn = document.getElementById("go");
    btn.disabled = true; btn.textContent = "چند لحظه…";
    try {
      const res = await fetch(`${API_BASE}/api/v1/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ new_password: pw, password_repeat: pw2, token })
      });
      if (!res.ok) throw new Error(await parseError(res));
      document.getElementById("resetForm").style.display = "none";
      document.getElementById("ok").style.display = "block";
      setTimeout(() => { window.location.href = "/index.html"; }, 2600);
    } catch (e) {
      showError(e.message || "بازنشانی رمز عبور ممکن نشد. دوباره تلاش کنید.");
      btn.disabled = false; btn.textContent = "بازنشانی رمز عبور";
    }
  });
</script>
</body>
</html>
